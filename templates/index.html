<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Buddy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #1c5980;
        }
        #results {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-radius: 4px;
            display: none;
        }
        #results h3 {
            margin-top: 0;
            color: #2980b9;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
            font-size: 16px;
        }
        #errorMessage {
            margin-top: 15px;
            color: #e74c3c;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Smart Study Buddy</h1>
    
    <div class="container">
        <p>Paste your class notes below to generate practice questions.</p>
        
        <textarea id="notesInput" placeholder="Enter your notes here..."></textarea>
        
        <button id="generateBtn">Generate Questions</button>
        
        <div id="errorMessage"></div>
        
        <div id="results"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => { 
            const generateBtn = document.getElementById('generateBtn'); 
            const notesInput = document.getElementById('notesInput'); 
            const resultsDiv = document.getElementById('results'); 
            const errorDiv = document.getElementById('errorMessage'); 

            generateBtn.addEventListener('click', async () => { 
                const notes = notesInput.value; 
                
                // Hide previous errors and show loading state
                errorDiv.style.display = 'none'; 
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = '<p>Generating questions... Please wait.</p>'; 

                if (!notes.trim()) { 
                    errorDiv.innerText = "Please enter some notes first."; 
                    errorDiv.style.display = 'block'; 
                    resultsDiv.style.display = 'none';
                    return; 
                } 

                try { 
                    console.log("Sending request..."); 
                    const response = await fetch('/generate', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ notes: notes }) 
                    }); 

                    const data = await response.json(); 
                    console.log("Server response:", data); 

                    if (!response.ok) { 
                        throw new Error(data.error || 'Failed to generate questions'); 
                    } 

                    // Display the questions 
                    resultsDiv.innerHTML = '<h3>Your Practice Questions:</h3>'; 
                    const list = document.createElement('ul'); 
                    data.questions.forEach(q => { 
                        const li = document.createElement('li'); 
                        li.innerText = q; 
                        list.appendChild(li); 
                    }); 
                    resultsDiv.appendChild(list); 

                } catch (error) { 
                    console.error("Error:", error); 
                    errorDiv.innerText = "Error: " + error.message; 
                    errorDiv.style.display = 'block'; 
                    resultsDiv.style.display = 'none';
                } 
            }); 
        });
    </script>
</body>
</html>
